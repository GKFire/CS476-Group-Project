{% extends "sclibrary/template_page_overview.html" %}

{% block content %}
<h5>Confirm Reset Password</h5>
<form method="post" class="sc-form">
    {% csrf_token %}
    {% for field in form %}
	    	{{ field.label_tag }} 
	        {{ field }}
	        {% if field.errors %}
	        	<small>{{ field.errors|striptags  }}</small> 
	        {% endif %}
	{% endfor %}
    <button type="submit" class="btn red lighten-2">Reset Password</button>
</form>
{% endblock %}
