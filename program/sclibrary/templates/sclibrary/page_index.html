{% extends "sclibrary/template_page_overview.html" %}

{% block styling %}
<style>
div.menu {
    background-color: white;
    border-radius: 20px;
    margin: 10% auto;
    padding: 15px;
    width: 500px;
    height: 400px;
    text-align: center;
    overflow-y: scroll;
}


div.login {
    margin: 15% 0%;

}

.name {
    margin: 10% 0%;
}

.subtext {
    margin: 5% 0%;
}


.login-button {
    background-color: #ee6e73;
    border-radius: 10px;
    padding: 15px 40px;
    text-decoration: none;
    color: white;
    margin: 20px 30px;
}
</style>
{% endblock %}


{% block content %}
<div class="menu">
    <h1 class="name">SCLibrary</h1>
    <h4 class="subtext">Sharing is Caring</h4>
    <div class="login">
        <a class="login-button" href="{% url 'login' %}">Login</a>
        <a class="login-button" href="{% url 'register' %}">Register</a>
    </div>
</div>
{% endblock %}
