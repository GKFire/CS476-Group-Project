{% extends "sclibrary/template_page_overview.html" %}

{% block content %}
<h5>Change Info for {{request.user.username}}</h5>
<ul>
<li><a class="waves-effect waves-light green btn" href="{% url 'change-username' %}">Change Username</a></li>
<li><a class="waves-effect waves-light green btn" href="{% url 'change-password' %}">Change Password</a></li>
<li><a class="waves-effect waves-light green btn" href="{% url 'change-email' %}">Change Email</a></li>
{% if request.user.lender != None %}
<li><a class="waves-effect waves-light green btn" href="{% url 'change-library' %}">Change Library</a></li>
{% endif %}
</ul>
{% endblock %}
